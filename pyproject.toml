[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "videostar"
version = "0.1.0"
description = "Cross-platform video/audio download application powered by yt-dlp"
readme = "README.md"
requires-python = ">=3.11"
license = "Unlicense"
authors = [{ name = "ezstyle42" }]
keywords = ["yt-dlp", "downloader", "video", "audio", "gui"]
classifiers = [
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6-Essentials>=6.6",
    "yt-dlp[default]>=2026.10.21",
    "mutagen>=1.47",
    "Pillow>=10.0",
    "imageio-ffmpeg>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10", "ruff>=0.8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
videostar = "videostar.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["videostar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: tests that download real media from the internet",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
